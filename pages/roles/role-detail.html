<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>yaUMS — Role</title>
  <link rel="stylesheet" href="/assets/css/base.css" />
  <link rel="stylesheet" href="/assets/css/layout.css" />
  <link rel="stylesheet" href="/assets/css/sidebar.css" />
  <link rel="stylesheet" href="/assets/css/buttons.css" />
  <link rel="stylesheet" href="/design-system/design-system.css" />
  <link rel="stylesheet" href="/assets/css/forms.css" />
  <link rel="stylesheet" href="/assets/css/table.css" />
  <link rel="stylesheet" href="/assets/css/toast.css" />
  <link rel="stylesheet" href="/assets/css/detail.css" />
  <link rel="stylesheet" href="/assets/css/loading.css" />
  <link rel="stylesheet" href="/assets/css/theme.css" />
  <script type="module">import { applyTheme } from '/js/theme/theme.js'; applyTheme();</script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="app-main">
      <header class="navbar" id="navbar"></header>
      <main class="page">
        <div class="page-header">
          <a href="/pages/roles/roles.html" class="btn btn--sm" id="detail-back" data-i18n="common.back"></a>
          <div class="detail-actions" id="detail-actions"></div>
        </div>
        <h1 id="detail-title"></h1>
        <p id="detail-sub" class="detail-empty"></p>
        <section class="detail-section">
          <h2 data-i18n="roles.permissions"></h2>
          <div class="relation-add" id="perms-add"></div>
          <ul class="relation-list" id="perms-list"></ul>
        </section>
      </main>
    </div>
  </div>
  <dialog id="role-dialog">
    <form id="role-form" method="dialog">
      <div class="form-field"><label data-i18n="roles.name"></label><input name="name" required /></div>
      <div class="form-field"><label data-i18n="roles.description"></label><input name="description" /></div>
      <button type="submit" class="btn btn--primary" data-i18n="common.save"></button>
      <button type="button" id="cancel-btn" class="btn" data-i18n="common.cancel"></button>
    </form>
  </dialog>
  <script type="module" src="./role-detail.js"></script>
</body>
</html>
