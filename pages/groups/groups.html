<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>yaUMS — Groups</title>
  <link rel="stylesheet" href="/assets/css/base.css" />
  <link rel="stylesheet" href="/assets/css/layout.css" />
  <link rel="stylesheet" href="/assets/css/sidebar.css" />
  <link rel="stylesheet" href="/assets/css/buttons.css" />
  <link rel="stylesheet" href="/assets/css/forms.css" />
  <link rel="stylesheet" href="/assets/css/table.css" />
  <link rel="stylesheet" href="/assets/css/toast.css" />
  <link rel="stylesheet" href="/assets/css/loading.css" />
  <link rel="stylesheet" href="/assets/css/theme.css" />
  <script type="module">import { applyTheme } from '/js/theme/theme.js'; applyTheme();</script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="app-main">
      <header class="navbar" id="navbar"></header>
      <main class="page">
        <div class="page-header">
          <h1 data-i18n="groups.title"></h1>
          <button id="create-btn" class="btn btn--primary" data-i18n="common.create"></button>
        </div>
        <table>
          <thead><tr id="groups-table-head"></tr></thead>
          <tbody id="groups-table-body"></tbody>
        </table>
        <div class="pagination" id="pagination"></div>
      </main>
    </div>
  </div>
  <dialog id="group-dialog">
    <form id="group-form" method="dialog">
      <div class="form-field"><label data-i18n="groups.name"></label><input name="name" required /></div>
      <div class="form-field"><label data-i18n="groups.description"></label><input name="description" /></div>
      <button type="submit" class="btn btn--primary" data-i18n="common.save"></button>
      <button type="button" id="cancel-btn" class="btn" data-i18n="common.cancel"></button>
    </form>
  </dialog>
  <script type="module" src="./groups.js"></script>
</body>
</html>
