<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>yaUMS — Audit Logs</title>
  <link rel="stylesheet" href="/assets/css/base.css" />
  <link rel="stylesheet" href="/assets/css/layout.css" />
  <link rel="stylesheet" href="/assets/css/sidebar.css" />
  <link rel="stylesheet" href="/assets/css/buttons.css" />
  <link rel="stylesheet" href="/assets/css/forms.css" />
  <link rel="stylesheet" href="/assets/css/table.css" />
  <link rel="stylesheet" href="/assets/css/toast.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="app-main">
      <header class="navbar" id="navbar"></header>
      <main class="page">
        <div class="page-header">
          <h1 data-i18n="auditLogs.title"></h1>
        </div>
        <table>
          <thead>
            <tr>
              <th data-i18n="auditLogs.actor"></th>
              <th data-i18n="auditLogs.entity"></th>
              <th data-i18n="auditLogs.action"></th>
              <th data-i18n="auditLogs.field"></th>
              <th data-i18n="auditLogs.oldValue"></th>
              <th data-i18n="auditLogs.newValue"></th>
              <th data-i18n="auditLogs.date"></th>
            </tr>
          </thead>
          <tbody id="audit-logs-table-body"></tbody>
        </table>
        <div class="pagination" id="pagination"></div>
      </main>
    </div>
  </div>
  <script type="module" src="./audit-logs.js"></script>
</body>
</html>
