<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>yaUMS — User</title>
  <link rel="stylesheet" href="/assets/css/base.css" />
  <link rel="stylesheet" href="/assets/css/layout.css" />
  <link rel="stylesheet" href="/assets/css/sidebar.css" />
  <link rel="stylesheet" href="/assets/css/buttons.css" />
  <link rel="stylesheet" href="/design-system/design-system.css" />
  <link rel="stylesheet" href="/assets/css/forms.css" />
  <link rel="stylesheet" href="/assets/css/table.css" />
  <link rel="stylesheet" href="/assets/css/toast.css" />
  <link rel="stylesheet" href="/assets/css/detail.css" />
  <link rel="stylesheet" href="/assets/css/loading.css" />
  <link rel="stylesheet" href="/assets/css/theme.css" />
  <script type="module">import { applyTheme } from '/js/theme/theme.js'; applyTheme();</script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="app-main">
      <header class="navbar" id="navbar"></header>
      <main class="page">
        <div class="page-header">
          <div id="detail-back"></div>
          <div class="detail-actions" id="detail-actions"></div>
        </div>
        <h1 id="detail-title"></h1>
        <p id="detail-sub" class="detail-empty"></p>

        <section class="detail-section">
          <h2 data-i18n="users.overview"></h2>
          <dl class="detail-meta" id="detail-meta"></dl>
        </section>

        <section class="detail-section" id="owner-section" hidden>
          <h2 data-i18n="users.transferOwnership"></h2>
          <div class="relation-add" id="owner-transfer"></div>
        </section>

        <section class="detail-section">
          <h2 data-i18n="users.groups"></h2>
          <div class="relation-add" id="groups-add"></div>
          <ul class="relation-list" id="groups-list"></ul>
        </section>

        <section class="detail-section">
          <h2 data-i18n="users.permissions"></h2>
          <div class="relation-add" id="perms-add"></div>
          <table class="detail-table">
            <thead><tr>
              <th data-i18n="users.permission"></th>
              <th data-i18n="users.permissionsSource"></th>
              <th></th>
            </tr></thead>
            <tbody id="perms-body"></tbody>
          </table>
        </section>
      </main>
    </div>
  </div>
  <dialog id="user-dialog">
    <form id="user-form" method="dialog">
      <div class="form-field"><label data-i18n="users.email"></label><input name="email" type="email" required /></div>
      <div class="form-field"><label data-i18n="users.password"></label><input name="password" type="password" /></div>
      <div class="form-field"><label data-i18n="users.firstName"></label><input name="firstName" required /></div>
      <div class="form-field"><label data-i18n="users.lastName"></label><input name="lastName" required /></div>
      <div class="form-field"><label data-i18n="users.role"></label><select name="roleId" required></select></div>
      <button type="submit" class="btn btn--primary" data-i18n="common.save"></button>
      <button type="button" id="cancel-btn" class="btn" data-i18n="common.cancel"></button>
    </form>
  </dialog>
  <script type="module" src="./user-detail.js"></script>
</body>
</html>
