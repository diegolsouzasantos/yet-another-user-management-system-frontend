<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>yaUMS — Users</title>
  <link rel="stylesheet" href="/assets/css/base.css" />
  <link rel="stylesheet" href="/assets/css/layout.css" />
  <link rel="stylesheet" href="/assets/css/sidebar.css" />
  <link rel="stylesheet" href="/assets/css/buttons.css" />
  <link rel="stylesheet" href="/assets/css/forms.css" />
  <link rel="stylesheet" href="/assets/css/table.css" />
  <link rel="stylesheet" href="/assets/css/toast.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="app-main">
      <header class="navbar" id="navbar"></header>
      <main class="page">
        <div class="page-header">
          <h1 data-i18n="users.title"></h1>
          <div><button id="transfer-btn" class="btn" hidden data-i18n="users.transferOwnership"></button>
          <button id="create-btn" class="btn btn--primary" data-i18n="common.create"></button></div>
        </div>
        <table>
          <thead><tr id="users-table-head"></tr></thead>
          <tbody id="users-table-body"></tbody>
        </table>
        <div class="pagination" id="pagination"></div>
      </main>
    </div>
  </div>
  <dialog id="user-dialog">
    <form id="user-form" method="dialog">
      <div class="form-field"><label data-i18n="users.email"></label><input name="email" type="email" required /></div>
      <div class="form-field"><label data-i18n="users.password"></label><input name="password" type="password" /></div>
      <div class="form-field"><label data-i18n="users.firstName"></label><input name="firstName" required /></div>
      <div class="form-field"><label data-i18n="users.lastName"></label><input name="lastName" required /></div>
      <div class="form-field"><label data-i18n="users.role"></label><select name="roleId" required></select></div>
      <button type="submit" class="btn btn--primary" data-i18n="common.save"></button>
      <button type="button" id="cancel-btn" class="btn" data-i18n="common.cancel"></button>
    </form>
  </dialog>
  <script type="module" src="./users.js"></script>
</body>
</html>
