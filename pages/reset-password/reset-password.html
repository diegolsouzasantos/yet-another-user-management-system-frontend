<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>yaUMS — Reset password</title>
  <link rel="stylesheet" href="/assets/css/base.css" />
  <link rel="stylesheet" href="/assets/css/buttons.css" />
  <link rel="stylesheet" href="/assets/css/forms.css" />
  <link rel="stylesheet" href="/assets/css/pages/login.css" />
  <link rel="stylesheet" href="/assets/css/theme.css" />
  <script type="module">import { applyTheme } from '/js/theme/theme.js'; applyTheme();</script>
</head>
<body>
  <div class="login-screen">
    <form class="card login-card" id="reset-form">
      <h1 data-i18n="auth.resetTitle"></h1>
      <div class="form-field">
        <label data-i18n="auth.newPassword"></label>
        <input type="password" name="password" required />
      </div>
      <p class="login-error" id="reset-message"></p>
      <button type="submit" class="btn btn--primary" data-i18n="auth.resetSubmit"></button>
      <a href="/pages/login/login.html" data-i18n="auth.backToLogin"></a>
    </form>
  </div>
  <script type="module" src="./reset-password.js"></script>
</body>
</html>
