<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>yaUMS — Permissions</title>
  <link rel="stylesheet" href="/assets/css/base.css" />
  <link rel="stylesheet" href="/assets/css/layout.css" />
  <link rel="stylesheet" href="/assets/css/sidebar.css" />
  <link rel="stylesheet" href="/assets/css/buttons.css" />
  <link rel="stylesheet" href="/assets/css/forms.css" />
  <link rel="stylesheet" href="/assets/css/table.css" />
  <link rel="stylesheet" href="/assets/css/toast.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="app-main">
      <header class="navbar" id="navbar"></header>
      <main class="page">
        <div class="page-header">
          <h1 data-i18n="permissions.title"></h1>
          <button id="create-btn" class="btn btn--primary" data-i18n="common.create"></button>
        </div>
        <table>
          <thead><tr id="permissions-table-head"></tr></thead>
          <tbody id="permissions-table-body"></tbody>
        </table>
        <div class="pagination" id="pagination"></div>
      </main>
    </div>
  </div>
  <dialog id="permission-dialog">
    <form id="permission-form" method="dialog">
      <div class="form-field"><label data-i18n="permissions.resource"></label><input name="resource" required /></div>
      <div class="form-field"><label data-i18n="permissions.action"></label><input name="action" required /></div>
      <div class="form-field"><label data-i18n="permissions.description"></label><input name="description" /></div>
      <button type="submit" class="btn btn--primary" data-i18n="common.save"></button>
      <button type="button" id="cancel-btn" class="btn" data-i18n="common.cancel"></button>
    </form>
  </dialog>
  <script type="module" src="./permissions.js"></script>
</body>
</html>
